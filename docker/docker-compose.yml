# Zion-HQ — full deployment stack.
#
# Stateful services (postgres, minio, redis, keycloak) are also declared here
# so a single `docker compose up` brings up the whole HQ. Production requires
# secrets to be supplied via the environment (see app/config.py — the services
# fail closed unless ZIONHQ_ENV=production and real secrets are set).
#
# Usage:  docker compose -f docker/docker-compose.yml --env-file .env up -d
name: zionhq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZIONHQ_DB_USER:-zionhq}
      POSTGRES_PASSWORD: ${ZIONHQ_DB_PASSWORD:-zionhq}
      POSTGRES_DB: ${ZIONHQ_DB_NAME:-zionhq}
    volumes:
      - zionhq-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ZIONHQ_S3_ACCESS_KEY:-zionhq}
      MINIO_ROOT_PASSWORD: ${ZIONHQ_S3_SECRET_KEY:-zionhq-dev-secret}
    volumes:
      - zionhq-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api-env
      ZIONHQ_ENV: ${ZIONHQ_ENV:-production}
      ZIONHQ_DATABASE_URL: postgresql+asyncpg://${ACADIAQ_DB_USER:-zionhq}:${ACADIAQ_DB_PASSWORD:-zionhq}@postgres:5432/${ACADIAQ_DB_NAME:-zionhq}
      ZIONHQ_REDIS_URL: redis://redis:6379/0
      ZIONHQ_S3_ENDPOINT_URL: http://minio:9000
      ZIONHQ_S3_ACCESS_KEY: ${ZIONHQ_S3_ACCESS_KEY:-zionhq}
      ZIONHQ_S3_SECRET_KEY: ${ZIONHQ_S3_SECRET_KEY:-zionhq-dev-secret}
      ZIONHQ_S3_BUCKET: ${ZIONHQ_S3_BUCKET:-zionhq}
      ZIONHQ_OIDC_ISSUER: ${ZIONHQ_OIDC_ISSUER:?set ZIONHQ_OIDC_ISSUER}
      ZIONHQ_OIDC_CLIENT_ID: ${ZIONHQ_OIDC_CLIENT_ID:-zionhq-api}
      ZIONHQ_OIDC_CLIENT_SECRET: ${ZIONHQ_OIDC_CLIENT_SECRET:?set ZIONHQ_OIDC_CLIENT_SECRET}
      ZIONHQ_SESSION_SECRET_KEY: ${ZIONHQ_SESSION_SECRET_KEY:?set ZIONHQ_SESSION_SECRET_KEY}
      ZIONHQ_CORS_ALLOW_ORIGINS: ${ZIONHQ_CORS_ALLOW_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ZIONHQ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m gateway.server
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ZIONHQ_GATEWAY_PORT:-50051}:50051"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${ZIONHQ_WEB_PORT:-8080}:80"

volumes:
  zionhq-pg-data:
  zionhq-minio-data:
