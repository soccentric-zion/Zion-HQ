[project]
name = "zionhq-api"
version = "0.1.0"
description = "Zion-HQ API: human-facing REST/WebSocket service (auth, devices, telemetry, ops)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "boto3>=1.35",
    "arq>=0.26",
    "grpcio>=1.66",
    "protobuf>=5.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
# FastAPI's dependency-injection pattern requires calling Depends(...) in
# argument defaults -- that's not the mutable-default-arg footgun B008 exists
# to catch.
ignore = [
    "B008",
    # `class Foo(str, enum.Enum)` is deliberate here for Pydantic/SQLAlchemy
    # JSON + DB serialization compatibility, not an oversight StrEnum should replace.
    "UP042",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
